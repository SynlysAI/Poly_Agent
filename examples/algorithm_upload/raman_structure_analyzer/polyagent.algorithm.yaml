contract_version: "0.2"
algorithm_id: raman_structure_analyzer
name: Raman Structure Analyzer
version: 0.1.0
visibility: public
algorithm_family: vertical_prediction
type: predictor
material_scope:
  - universal
task_scope:
  - COMPUTE_PREDICT
trigger_modes:
  - human_workflow
entrypoint: src.handler:predict
loader: src.handler:load
runtime:
  python: "3.11"
  resources:
    cpu: 2
    memory: 8Gi
    gpu: true
  timeout_seconds: 180
input_schema:
  fields:
    spectype: string
    mode: string
    x0: number
    x1: number
    k: integer
    transmittance: boolean
    device: string
  required:
    - spectype
    - mode
  field_defaults:
    spectype: raman
    mode: function_groups
    k: 3
    transmittance: false
  field_options:
    spectype:
      - raman
    mode:
      - function_groups
    device:
      - cpu
      - cuda
output_schema:
  fields:
    candidates: list
    point_count: integer
    metadata: object
    preprocessing: object
  required:
    - candidates
input_assets:
  - key: spectrum_file
    label: Spectrum data file
    required: true
    asset_role: input
    data_kind: series
    parser: series_xy.v1
    extensions:
      - .txt
      - .dat
      - .csv
      - .xlsx
    mime_types:
      - text/plain
      - text/csv
      - application/octet-stream
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    max_size_bytes: 10485760
    sample_path: tests/sample_assets/sample_spectrum.dat
output_assets:
  - key: normalized_series
    label: Normalized input series
    asset_role: output
    data_kind: series
    artifact_type: series_json
    mime_type: application/json
  - key: structure_candidates
    label: Structure candidates
    asset_role: output
    data_kind: json
    artifact_type: structure_json
    mime_type: application/json
  - key: candidate_table
    label: Candidate table
    asset_role: output
    data_kind: table
    artifact_type: csv
    mime_type: text/csv
  - key: run_report
    label: Run report
    asset_role: output
    data_kind: json
    artifact_type: report_json
    mime_type: application/json
resource_assets:
  - key: raman_runtime_resources
    label: Raman runtime resources root
    asset_role: resource
    data_kind: binary
    parser: binary.v1
    required: false
    resource_type: raman_runtime
    required_files:
      - checkpoints/baseline_removal.pth
      - checkpoints/raman_fg.pth
    binding_required: false
    description: Optional managed binding. If omitted, the package reads RAMAN_RESOURCES_ROOT or the service default Raman resource root. This function-group-only package does not require raman_generation.pth or tokenizer files.
result_envelope: polyagent_run_result.v1
sample_input_path: tests/sample_input.json
description: Raman spectral functional group analysis packaged with generic file I/O assets.
developer: Raman Structure Analyzer 模型团队
developer_organization: 嘉庚实验室 / 厦门大学
source_url: refer/raman
method_attributions:
  - name: Raman/IR structure analysis reference implementation
    role: implementation_source
    organization: Raman Reference Implementation
    description: Adapted from the local refer/raman reference code.
implementation_notes: Function-group-only package; it uses baseline_removal.pth and raman_fg.pth, and does not require raman_generation.pth.
