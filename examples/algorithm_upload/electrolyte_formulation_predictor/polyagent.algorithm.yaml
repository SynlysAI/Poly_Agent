contract_version: "0.1"
algorithm_id: electrolyte_formulation_predictor
name: 含氟电解液配方性能预测
version: 0.1.0
algorithm_family: vertical_prediction
type: predictor
material_scope:
  - fluoropolymer
task_scope:
  - COMPUTE_PREDICT
trigger_modes:
  - human_workflow
  - autoresearch
entrypoint: src.handler:predict
loader: src.handler:load
runtime:
  python: "3.11"
  resources:
    cpu: 1
    memory: 1Gi
    gpu: false
  timeout_seconds: 30
input_schema:
  fields:
    formulations: list
  required:
    - formulations
output_schema:
  fields:
    results: list
  required:
    - results
sample_input_path: tests/sample_input.json
description: 根据锂盐、溶剂/单体/填料组成及配比，预测第 1、4、20 周期放电比容量和库仑效率。
