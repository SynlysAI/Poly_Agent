    knowledge_base_ids: ["kb-fluoro-handbook"]
  expected:
    task_success: true
    retrieval:
      source: knowledge
      relevant_ids: ["kb:fh-dielectric-pvdf"]
    answer:
      type: numeric
      numeric_value: 9.5
      numeric_tolerance: {kind: absolute, value: 1.5}
    hallucination:
      require_citations: true
      checks: ["介电常数数值必须来自知识库命中片段"]
  fixture:
    run:
      run_id: fixture-run-kr-0001
      status: completed
      duration_ms: 4200
      first_token_ms: 900
      total_tokens: 2100
    retrievals:
      - source: knowledge
        status: searched
        duration_ms: 350
        results:
          - {id: "kb:fh-dielectric-pvdf", rank: 1, score: 0.92, snippet: "PVDF 介电常数典型范围 8–11", used_in_answer: true}
          - {id: "kb:fh-overview", rank: 2, score: 0.71, snippet: "氟聚合物手册总览", used_in_answer: false}
    message:
      content: 根据知识库，PVDF 的介电常数典型值约为 9.5（范围 8–11）。
      references:
        - {label: "PVDF 介电常数", target: "/knowledge?system_id=kb-fluoro-handbook", type: knowledge, source_id: "kb:fh-dielectric-pvdf", rank: 1}

