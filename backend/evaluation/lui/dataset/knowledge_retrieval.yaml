- id: LUI-KR-0003
  category: knowledge_retrieval
  difficulty: hard
  mode: deep
  messages:
    - role: user
      content: 对比知识库中氟聚合物与碳聚合物的介电性能差异，并给出依据文档。
  context:
    use_knowledge_base: true
    knowledge_base_ids: ["kb-fluoro-handbook", "kb-carbon-handbook"]
  expected:
    task_success: true
    retrieval:
      source: knowledge
      relevant_ids: ["kb:fh-dielectric-pvdf", "kb:ch-dielectric-pp"]
    answer:
      type: rubric
      must_include: ["介电", "氟聚合物", "碳聚合物"]
    hallucination:
      require_citations: true
  fixture:
    run:
      run_id: fixture-run-kr-0003
      status: completed
      duration_ms: 8600
      first_token_ms: 1500
      total_tokens: 4300
    retrievals:
      - source: knowledge
        status: searched
        duration_ms: 620
        results:
          - {id: "kb:fh-dielectric-pvdf", rank: 1, score: 0.89, snippet: "PVDF 介电常数 8–11", used_in_answer: true}
          - {id: "kb:ch-dielectric-pp", rank: 2, score: 0.84, snippet: "PP 介电常数 2.2–2.4", used_in_answer: true}
          - {id: "kb:fh-overview", rank: 3, score: 0.66, snippet: "氟聚合物总览", used_in_answer: false}
    message:
      content: 介电性能对比：氟聚合物（如 PVDF，介电常数 8–11）明显高于碳聚合物（如 PP，介电常数 2.2–2.4），差异主要来自极性 C–F 键。
      references:
        - {label: "PVDF 介电常数", target: "/knowledge", type: knowledge, source_id: "kb:fh-dielectric-pvdf", rank: 1}
        - {label: "PP 介电常数", target: "/knowledge", type: knowledge, source_id: "kb:ch-dielectric-pp", rank: 2}

