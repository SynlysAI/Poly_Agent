# 联网检索分桶：使用预先录制的检索快照，relevant_ids 对应稳定 URL。
- id: LUI-WR-0001
  category: web_retrieval
  difficulty: medium
  mode: deep
  messages:
    - role: user
      content: 联网检索 ChemOS 2.0 自驱实验室框架的项目页，并总结其定位。
  context:
    use_web_search: true
  expected:
    task_success: true
    retrieval:
      source: web
      relevant_ids: ["https://github.com/RescPai/ChemOS"]
    answer:
      type: rubric
      must_include: ["ChemOS", "自驱"]
    hallucination:
      require_citations: true
  fixture:
    run:
      run_id: fixture-run-wr-0001
      status: completed
      duration_ms: 9200
      first_token_ms: 1800
      total_tokens: 5200
    retrievals:
      - source: web
        status: searched
        duration_ms: 900
        results:
          - {id: "https://github.com/RescPai/ChemOS", rank: 1, score: null, snippet: "ChemOS self-driving lab", used_in_answer: true}
          - {id: "https://example.org/chemos-paper", rank: 2, score: null, snippet: "ChemOS paper", used_in_answer: false}
    message:
      content: ChemOS 2.0 是自驱实验室编排框架，项目页给出其架构与模块定位，详见来源引用。
      references:
        - {label: "ChemOS", target: "https://github.com/RescPai/ChemOS", type: web, source_id: "https://github.com/RescPai/ChemOS", rank: 1}

