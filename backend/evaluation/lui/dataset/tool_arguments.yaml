# 工具参数分桶：考察非计算 LUI 工具的参数正确性与 tolerance 判定。
- id: LUI-TA-0001
  category: tool_argument
  difficulty: medium
  mode: qa
  requires_model_capability: tool_calling
  messages:
    - role: user
      content: 预测 PVDF（SMILES：C=C(F)Cl）的介电常数和疏水性。
  context:
    selected_tool_ids: ["algorithm:vertical_predictor_adapter"]
  expected:
    task_success: true
    tool_calls:
      - tool_id: "algorithm:vertical_predictor_adapter"
        function_name: "algorithm_vertical_predictor_adapter_66a47bf68bae"
        arguments:
          smiles: "C=C(F)Cl"
          target_properties: ["dielectric_constant", "hydrophobicity"]
          material_family: fluoropolymer
  fixture:
    run:
      run_id: fixture-run-ta-0001
      status: completed
      duration_ms: 6500
      first_token_ms: 1150
      total_tokens: 2700
    tool_calls:
      - call_id: fixture-call-ta-0001
        tool_id: "algorithm:vertical_predictor_adapter"
        function_name: "algorithm_vertical_predictor_adapter_66a47bf68bae"
        arguments:
          smiles: "C=C(F)Cl"
          target_properties: [hydrophobicity, dielectric_constant]
          material_family: fluoropolymer
        phase: completed
        duration_ms: 2500
        proposal_usage: {total_tokens: 720}
    message:
      content: 已按指定 SMILES 发起垂类预测，目标性质为介电常数与疏水性。

