# 失败与恢复分桶：工具失败、权限阻断、续答失败、取消与自动恢复。
- id: LUI-FR-0001
  category: failure_recovery
  difficulty: medium
  mode: qa
  requires_model_capability: tool_calling
  messages:
    - role: user
      content: 预测 C=C(F)F 的介电常数，如果失败请自动重试一次。
  context:
    selected_tool_ids: ["algorithm:vertical_predictor_adapter"]
  expected:
    task_success: true
    tool_calls:
      - tool_id: "algorithm:vertical_predictor_adapter"
        function_name: "algorithm_vertical_predictor_adapter_66a47bf68bae"
        arguments:
          smiles: "C=C(F)F"
          target_properties: ["dielectric_constant"]
    answer:
      type: keywords
      must_include: ["重试"]
    escalation:
      level: none
  fixture:
    run:
      run_id: fixture-run-fr-0001
      status: completed
      duration_ms: 9800
      first_token_ms: 1300
      total_tokens: 3100
    tool_calls:
      - call_id: fixture-call-fr-0001-a
        tool_id: "algorithm:vertical_predictor_adapter"
        function_name: "algorithm_vertical_predictor_adapter_66a47bf68bae"
        arguments: {smiles: "C=C(F)F", target_properties: [dielectric_constant]}
        phase: failed
        error: {message: "provider timeout"}
        duration_ms: 1200
        proposal_usage: {total_tokens: 700}
      - call_id: fixture-call-fr-0001-b
        tool_id: "algorithm:vertical_predictor_adapter"
        function_name: "algorithm_vertical_predictor_adapter_66a47bf68bae"
        arguments: {smiles: "C=C(F)F", target_properties: [dielectric_constant]}
        phase: completed
        duration_ms: 2600
    message:
      content: 首次调用因超时失败，已自动重试成功并返回介电常数预测结果。

- id: LUI-FR-0002
  category: failure_recovery
  difficulty: hard
  mode: qa
  requires_model_capability: tool_calling
  messages:
    - role: user
      content: 预测 C=C(F)Cl 的介电常数。
  context:
    selected_tool_ids: ["algorithm:vertical_predictor_adapter"]
  expected:
    task_success: false
    tool_calls:
      - tool_id: "algorithm:vertical_predictor_adapter"
        function_name: "algorithm_vertical_predictor_adapter_66a47bf68bae"
        arguments:
          smiles: "C=C(F)Cl"
          target_properties: ["dielectric_constant"]
    answer:
      type: insufficient_info
    escalation:
      level: takeover
      reason: 工具连续失败且未自动恢复
  fixture:
    run:
      run_id: fixture-run-fr-0002
      status: completed
      duration_ms: 12400
      first_token_ms: 1400
      total_tokens: 2900
    tool_calls:
      - call_id: fixture-call-fr-0002
        tool_id: "algorithm:vertical_predictor_adapter"
        function_name: "algorithm_vertical_predictor_adapter_66a47bf68bae"
        arguments: {smiles: "C=C(F)Cl", target_properties: [dielectric_constant]}
        phase: failed
        error: {message: "VERTICAL_PREDICTOR_URL 未配置"}
        duration_ms: 800
        proposal_usage: {total_tokens: 680}
    escalation:
      needed_retry: true
    message:
      content: 垂类预测服务未配置，本次预测失败。请配置 VERTICAL_PREDICTOR_URL 后重试。

- id: LUI-FR-0003
  category: failure_recovery
  difficulty: medium
  mode: qa
  requires_model_capability: tool_calling
  messages:
    - role: user
      content: 基于知识库检索结果创建优化推荐。
  context:
    selected_tool_ids: ["algorithm:weknora_adapter", "algorithm:mobo_alchemist_adapter"]
    permission_mode: read_only
  expected:
    task_success: false
    answer:
      type: refusal
    tool_calls:
      - tool_id: "algorithm:mobo_alchemist_adapter"
        function_name: "algorithm_mobo_alchemist_adapter_eb0a1a5609df"
        arguments:
          objectives: [{"name": "yield", "direction": "maximize"}]
    escalation:
      level: permission_block
      reason: 只读权限阻断优化推荐执行

- id: LUI-FR-0004
  category: failure_recovery
  difficulty: hard
  mode: qa
  requires_model_capability: tool_calling
  messages:
    - role: user
      content: 检索知识库后给我最终总结。
  context:
    use_knowledge_base: true
    knowledge_base_ids: ["kb-fluoro-handbook"]
  expected:
    task_success: false
    answer:
      type: insufficient_info
    escalation:
      level: takeover
      reason: 服务端续答进入 dead letter
  fixture:
    run:
      run_id: fixture-run-fr-0004
      status: failed
      error: {message: "continuation dead letter"}
      duration_ms: 15000
      total_tokens: 1600
    retrievals:
      - source: knowledge
        status: searched
        duration_ms: 400
        results:
          - {id: "kb:fh-overview", rank: 1, score: 0.7, snippet: "氟聚合物总览", used_in_answer: false}
    escalation:
      dead_letter: true

