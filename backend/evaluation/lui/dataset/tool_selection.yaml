# 工具选择分桶：多个非计算 LUI 工具候选下考察模型是否选对工具。
# 边界：xTB/CREST/ORCA/结构生成/ComputeEngine 计算类工具不参与本评测。
- id: LUI-TS-0001
  category: tool_selection
  difficulty: easy
  mode: qa
  requires_model_capability: tool_calling
  messages:
    - role: user
      content: 预测 SMILES 为 C=C(F)F 的聚合物介电常数。
  context:
    selected_tool_ids:
      - "algorithm:vertical_predictor_adapter"
      - "algorithm:mobo_alchemist_adapter"
      - "algorithm:weknora_adapter"
  expected:
    task_success: true
    tool_calls:
      - tool_id: "algorithm:vertical_predictor_adapter"
        function_name: "algorithm_vertical_predictor_adapter_66a47bf68bae"
        arguments:
          smiles: "C=C(F)F"
          target_properties: ["dielectric_constant"]
          material_family: fluoropolymer
    answer:
      type: keywords
      must_include: ["介电"]
  fixture:
    run:
      run_id: fixture-run-ts-0001
      status: completed
      duration_ms: 6200
      first_token_ms: 1100
      total_tokens: 2600
    tool_calls:
      - call_id: fixture-call-ts-0001
        tool_id: "algorithm:vertical_predictor_adapter"
        function_name: "algorithm_vertical_predictor_adapter_66a47bf68bae"
        arguments: {smiles: "C=C(F)F", target_properties: [dielectric_constant], material_family: fluoropolymer}
        phase: completed
        duration_ms: 2400
        proposal_usage: {total_tokens: 700}
    message:
      content: 已使用垂类性质预测服务预测 C=C(F)F 的介电常数，结果见工具返回。

