<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Poly Agent 项目定位图</title>
  <desc id="desc">Poly Agent 位于 AI4MS 门户和具体材料研发工具之间，提供任务定义、算法编排、计算执行、知识检索和研发闭环。</desc>
  <style>
    text { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
    .title { font-size: 34px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 17px; fill: #475569; }
    .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1px; fill: #0f766e; }
    .head { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 16px; fill: #334155; }
    .small { font-size: 14px; fill: #64748b; }
  </style>
  <rect width="1440" height="760" fill="#f8fafc"/>
  <text class="title" x="64" y="62">Poly Agent 项目定位</text>
  <text class="subtitle" x="64" y="94">把材料研发中的“问题、证据、算法、计算和实验”组织成一条可追溯的工作流</text>

  <rect x="64" y="150" width="260" height="438" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="eyebrow" x="92" y="190">上游入口</text>
  <text class="head" x="92" y="228">AI4MS 门户</text>
  <text class="body" x="92" y="274">统一账户与 SSO</text>
  <text class="body" x="92" y="308">项目与数据入口</text>
  <text class="body" x="92" y="342">跨工具任务导航</text>
  <line x1="92" y1="384" x2="296" y2="384" stroke="#e2e8f0"/>
  <text class="small" x="92" y="424">用户无需在多个工具之间</text>
  <text class="small" x="92" y="448">重复搬运材料、参数和结果。</text>

  <rect x="414" y="126" width="612" height="486" rx="22" fill="#0f172a"/>
  <text class="eyebrow" x="456" y="174" fill="#5eead4">核心平台</text>
  <text x="456" y="222" font-size="34" font-weight="700" fill="#ffffff">Poly Agent</text>
  <text x="456" y="256" font-size="18" fill="#cbd5e1">高分子材料智能研发工作台</text>
  <rect x="456" y="296" width="238" height="92" rx="12" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="482" y="333" font-size="19" font-weight="700" fill="#ffffff">定义问题</text>
  <text x="482" y="362" font-size="14" fill="#ccfbf1">ProblemSpec / 目标 / 约束</text>
  <rect x="720" y="296" width="238" height="92" rx="12" fill="#172554" stroke="#60a5fa"/>
  <text x="746" y="333" font-size="19" font-weight="700" fill="#ffffff">组织执行</text>
  <text x="746" y="362" font-size="14" fill="#dbeafe">Workflow / Worker / Adapter</text>
  <rect x="456" y="414" width="238" height="92" rx="12" fill="#451a03" stroke="#f59e0b"/>
  <text x="482" y="451" font-size="19" font-weight="700" fill="#ffffff">沉淀证据</text>
  <text x="482" y="480" font-size="14" fill="#fef3c7">Artifact / Audit / Knowledge</text>
  <rect x="720" y="414" width="238" height="92" rx="12" fill="#3f1d3d" stroke="#f472b6"/>
  <text x="746" y="451" font-size="19" font-weight="700" fill="#ffffff">推动决策</text>
  <text x="746" y="480" font-size="14" fill="#fce7f3">Gate / Report / Next round</text>
  <text x="456" y="558" font-size="15" fill="#94a3b8">内置 Alchemist、ComputeEngine、ResearchEngine、知识库和垂类算法管理</text>

  <rect x="1116" y="150" width="260" height="438" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="eyebrow" x="1144" y="190">下游产出</text>
  <text class="head" x="1144" y="228">可执行的研发决策</text>
  <text class="body" x="1144" y="274">下一轮实验建议</text>
  <text class="body" x="1144" y="308">计算与预测结果</text>
  <text class="body" x="1144" y="342">可复核的证据链</text>
  <text class="body" x="1144" y="376">可交付的研发报告</text>
  <line x1="1144" y1="414" x2="1348" y2="414" stroke="#e2e8f0"/>
  <text class="small" x="1144" y="454">结果可以被复现、审计，</text>
  <text class="small" x="1144" y="478">也可以继续进入下一轮。</text>

  <line x1="324" y1="370" x2="414" y2="370" stroke="#0f766e" stroke-width="3"/>
  <polygon points="414,370 402,363 402,377" fill="#0f766e"/>
  <line x1="1026" y1="370" x2="1116" y2="370" stroke="#0f766e" stroke-width="3"/>
  <polygon points="1116,370 1104,363 1104,377" fill="#0f766e"/>
  <rect x="64" y="654" width="1312" height="58" rx="10" fill="#e2e8f0"/>
  <text class="body" x="88" y="690">一句话：Poly Agent 不是单点预测器，而是面向材料研发团队的“任务优先、证据驱动、人工可控”的智能研发操作系统。</text>
</svg>
