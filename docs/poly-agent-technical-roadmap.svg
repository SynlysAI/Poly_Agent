<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Poly Agent 技术路线图</title>
  <desc id="desc">Poly Agent 从当前 P0 演示基线，经 P1 生产化增强，走向 P2 真实实验与规模化协同。</desc>
  <style>
    text { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
    .title { font-size: 34px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 17px; fill: #475569; }
    .phase { font-size: 22px; font-weight: 700; fill: #ffffff; }
    .tag { font-size: 14px; font-weight: 700; }
    .head { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 14px; fill: #334155; }
    .small { font-size: 13px; fill: #64748b; }
  </style>
  <rect width="1440" height="820" fill="#f8fafc"/>
  <text class="title" x="64" y="62">Poly Agent 技术路线图</text>
  <text class="subtitle" x="64" y="94">以“可演示闭环 → 可运营平台 → 可连接真实实验”为三段式演进主线</text>

  <rect x="64" y="148" width="402" height="500" rx="18" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/>
  <rect x="64" y="148" width="402" height="72" rx="18" fill="#0f766e"/><text class="phase" x="94" y="193">P0 · 当前基线</text><text class="tag" x="344" y="190" fill="#ccfbf1">已完成 / 可演示</text>
  <text class="head" x="94" y="268">证明研发闭环可用</text>
  <text class="body" x="94" y="310">✓ Alchemist DoE / GP / 采集优化</text>
  <text class="body" x="94" y="342">✓ ComputeEngine run / worker / artifact</text>
  <text class="body" x="94" y="374">✓ ResearchEngine 人工 + AutoResearch 双通道</text>
  <text class="body" x="94" y="406">✓ WeKnora 知识库问答与证据检索</text>
  <text class="body" x="94" y="438">✓ 垂类算法上传、测试与运行历史</text>
  <text class="body" x="94" y="470">✓ 任务中心、助手、报告和审计追溯</text>
  <line x1="94" y1="512" x2="436" y2="512" stroke="#e2e8f0"/>
  <text class="small" x="94" y="548">运行方式：本地依赖 + demo store / mock / fixture</text>
  <text class="small" x="94" y="574">目标：先让用户看到完整、可复核的流程</text>

  <rect x="520" y="148" width="402" height="500" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <rect x="520" y="148" width="402" height="72" rx="18" fill="#1d4ed8"/><text class="phase" x="550" y="193">P1 · 近期增强</text><text class="tag" x="798" y="190" fill="#dbeafe">生产化</text>
  <text class="head" x="550" y="268">让能力可运营、可扩展</text>
  <text class="body" x="550" y="310">→ Schema 驱动算法表单与 Registry 管理</text>
  <text class="body" x="550" y="342">→ checkpoint / rerun / pause-resume 语义</text>
  <text class="body" x="550" y="374">→ 真实模型服务与垂类预测接入</text>
  <text class="body" x="550" y="406">→ worker 优雅退出、队列和重试策略</text>
  <text class="body" x="550" y="438">→ 对象存储、下载 token 和审计细化</text>
  <text class="body" x="550" y="470">→ 浏览器 e2e、运行指标和可观测性</text>
  <line x1="550" y1="512" x2="892" y2="512" stroke="#e2e8f0"/>
  <text class="small" x="550" y="548">关键判断：优先补真实依赖和运维边界，</text>
  <text class="small" x="550" y="574">不重复建设孤立的 adapter 或 planner。</text>

  <rect x="976" y="148" width="402" height="500" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <rect x="976" y="148" width="402" height="72" rx="18" fill="#b45309"/><text class="phase" x="1006" y="193">P2 · 规模化方向</text><text class="tag" x="1254" y="190" fill="#fef3c7">规划中</text>
  <text class="head" x="1006" y="268">把数字闭环连接到真实世界</text>
  <text class="body" x="1006" y="310">→ ORCA / HPC / AiiDA 真实执行器</text>
  <text class="body" x="1006" y="342">→ SpecLabOS / LabOS 实验提交与回填</text>
  <text class="body" x="1006" y="374">→ 多材料 profile、模型更新与经验沉淀</text>
  <text class="body" x="1006" y="406">→ 团队协作、项目级权限和配额治理</text>
  <text class="body" x="1006" y="438">→ 规模化数据资产、图谱和报告交付</text>
  <text class="body" x="1006" y="470">→ 跨项目复用的策略与知识资产</text>
  <line x1="1006" y1="512" x2="1348" y2="512" stroke="#e2e8f0"/>
  <text class="small" x="1006" y="548">成功标准：实验、计算、知识和决策</text>
  <text class="small" x="1006" y="574">在同一条证据链上持续迭代。</text>

  <line x1="466" y1="390" x2="520" y2="390" stroke="#0f766e" stroke-width="4"/><polygon points="520,390 506,382 506,398" fill="#0f766e"/>
  <line x1="922" y1="390" x2="976" y2="390" stroke="#0f766e" stroke-width="4"/><polygon points="976,390 962,382 962,398" fill="#0f766e"/>
  <rect x="64" y="690" width="1314" height="66" rx="12" fill="#0f172a"/>
  <text x="94" y="731" font-size="16" font-weight="700" fill="#ffffff">路线原则</text>
  <text x="224" y="731" font-size="15" fill="#cbd5e1">每个阶段都必须可运行、可验收、可回退；真实系统接入以 integration config 和 adapter 契约为边界。</text>
</svg>
