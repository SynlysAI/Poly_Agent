  <text class="title" x="56" y="60">Poly Agent 技术架构图</text>
  <text class="subtitle" x="56" y="88">高分子材料智能研发平台：前端工作台、FastAPI 后端、领域服务、计算执行、WeKnora 知识库与外部系统集成</text>

