<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Poly Agent 技术架构图</title>
  <desc id="desc">Poly Agent 从浏览器前端、FastAPI 后端、领域服务、计算 worker、WeKnora 知识服务到存储和外部系统的技术架构。</desc>
  <style>
    text { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
    .title { font-size: 34px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 16px; font-weight: 500; fill: #475569; }
    .group { font-size: 18px; font-weight: 700; fill: #111827; }
    .label { font-size: 17px; font-weight: 700; fill: #111827; }
    .small { font-size: 13px; font-weight: 500; fill: #334155; }
    .tiny { font-size: 12px; font-weight: 500; fill: #64748b; }
  </style>

